flutter_launcher_icons:
  image_path: "assets/icons/logo.png"

  android: "launcher_icon"
  image_path_android: "assets/icons/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#021526"
  adaptive_icon_foreground: "assets/icons/logo_transparent.png"
  adaptive_icon_foreground_inset: 15
  adaptive_icon_monochrome: "assets/icons/logo_transparent.png"

  ios: true
  image_path_ios: "assets/icons/logo.png"
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "assets/icons/logo_transparent.png"
  image_path_ios_tinted_grayscale: "assets/icons/logo_transparent.png"
  desaturate_tinted_to_grayscale_ios: true
  background_color_ios: "#021526"
